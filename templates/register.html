<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - AI Interview Prep</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

    <nav class="navbar">

        <h2>AI Interview Prep</h2>

        <div>
            <a href="/">Home</a>
            <a href="/login">Login</a>
        </div>

    </nav>


    <section class="hero">

        <h1>Create Your Account</h1>

        <p>Start your AI-powered interview preparation.</p>

        <form method="POST" action="/register">

          <input
    type="text"
    name="name"
    placeholder="Enter your name"
    required
>

            <br><br>

            <input
    type="email"
    name="email"
    placeholder="Enter your email"
    required
>

            <br><br>

           <input
    type="password"
    name="password"
    placeholder="Create a password"
    required
>
            <br><br>

            <button type="submit" class="start-btn">
                Create Account
            </button>

        </form>

        <br>

        <p>
            Already have an account?
            <a href="/login">Login</a>
        </p>

    </section>


    <footer>

        <p>© 2026 AI Interview Preparation System</p>

    </footer>

</body>

</html>
